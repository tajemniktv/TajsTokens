name: portable-build

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the portable build
        required: true
        type: string
      artifact-name:
        description: Artifact name; leave empty to skip packaging/upload
        required: false
        default: ''
        type: string
      retention-days:
        description: Artifact retention when artifact-name is set
        required: false
        default: 7
        type: number

permissions:
  contents: read

jobs:
  validate-portable:
    name: Build, test and launch portable app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TajsTokens.sln

      - name: Build
        run: dotnet build TajsTokens.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TajsTokens.Core.Tests/TajsTokens.Core.Tests.csproj --configuration Release --no-build

      - name: Publish portable Windows x64
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet publish src/TajsTokens.App/TajsTokens.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            --no-restore `
            --output artifacts/TajsTokens-win-x64-portable

          if (-not (Test-Path artifacts/TajsTokens-win-x64-portable/TajsTokens.App.exe)) {
            throw "Published TajsTokens.App.exe was not produced."
          }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path 'artifacts/TajsTokens-win-x64-portable/TajsTokens.App.exe'
          $startedAt = Get-Date
          $process = $null

          try {
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 10
            $process.Refresh()

            if ($process.HasExited) {
              Start-Sleep -Seconds 2
              Write-Host 'Published app exited during startup. Recent Windows application events:'
              Get-WinEvent -FilterHashtable @{
                LogName = 'Application'
                StartTime = $startedAt.AddSeconds(-5)
              } -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Message -match 'TajsTokens|Microsoft\.UI\.Xaml|CoreCLR|WindowsAppRuntime'
                } |
                Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message |
                Format-List |
                Out-String |
                Write-Host

              throw "Published app exited during startup with code $($process.ExitCode)."
            }

            Write-Host "Portable app remained alive for the 10-second startup smoke window."
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(5000) | Out-Null
            }
          }

      - name: Package portable artifact
        if: inputs.artifact-name != ''
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/TajsTokens-win-x64-portable/* `
            -DestinationPath artifacts/TajsTokens-win-x64-portable.zip

          $hash = (Get-FileHash artifacts/TajsTokens-win-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TajsTokens-win-x64-portable.zip" | Set-Content artifacts/TajsTokens-win-x64-portable.sha256

      - name: Upload portable artifact
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            artifacts/TajsTokens-win-x64-portable.zip
            artifacts/TajsTokens-win-x64-portable.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
