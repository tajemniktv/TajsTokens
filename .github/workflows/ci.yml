name: ci

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Portable validation
    uses: ./.github/workflows/portable.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
