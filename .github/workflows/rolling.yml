name: rolling-release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine rolling version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Rolling releases must be dispatched from main, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Determine rolling version
        id: version
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess

          versions = []
          for tag in subprocess.check_output(['git', 'tag', '--list', 'v*'], text=True).splitlines():
              match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if versions:
              major, minor, patch = max(versions)
              patch += 1
          else:
              major, minor, patch = 0, 0, 1

          version = f'{major}.{minor}.{patch}-rolling.{os.environ["GITHUB_RUN_NUMBER"]}+{os.environ["GITHUB_SHA"][:7]}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PY

  build:
    name: Validate rolling portable
    needs: version
    uses: ./.github/workflows/portable.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-name: rolling-portable
      retention-days: 1

  release:
    name: Publish Rolling Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Retrieve artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rolling-portable
          path: artifact

      - name: Publish moving rolling prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          revalidate_main() {
            git fetch --force origin main:refs/remotes/origin/main
            current_main="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo "Skipping stale rolling publication: main=$current_main workflow=$GITHUB_SHA"
              exit 0
            fi
          }

          # Publication is serialized and non-cancelling so an older run cannot finish after a newer one.
          revalidate_main

          git tag -f rolling "$GITHUB_SHA"
          git push --force origin refs/tags/rolling

          # Main may have advanced while the tag was being moved. Do not replace public assets with
          # an older build even if that race happened between the first check and tag update.
          revalidate_main

          notes="$(cat <<EOF
          Automated portable build from \`main\`.

          **Version:** \`$VERSION\`
          **Commit:** \`$GITHUB_SHA\`

          This release is a moving prerelease. Use stable \`vX.Y.Z\` releases for immutable builds.
          EOF
          )"

          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling \
              artifact/TajsTokens-win-x64-portable.zip \
              artifact/TajsTokens-win-x64-portable.sha256 \
              --clobber
            gh release edit rolling \
              --prerelease \
              --title "TajsTokens Rolling $VERSION" \
              --notes "$notes"
          else
            gh release create rolling \
              artifact/TajsTokens-win-x64-portable.zip \
              artifact/TajsTokens-win-x64-portable.sha256 \
              --verify-tag \
              --prerelease \
              --title "TajsTokens Rolling $VERSION" \
              --notes "$notes"
          fi

          current_artifact_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=rolling-portable&per_page=100" \
              --jq '.artifacts[0].id'
          )"

          if [[ -z "$current_artifact_id" || "$current_artifact_id" == "null" ]]; then
            echo "Could not resolve the current rolling-portable artifact; refusing to prune artifacts." >&2
            exit 1
          fi

          echo "Keeping rolling-portable artifact $current_artifact_id and deleting older copies."
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=rolling-portable&per_page=100" \
            --jq '.artifacts[].id' |
            while read -r artifact_id; do
              if [[ "$artifact_id" != "$current_artifact_id" ]]; then
                echo "Deleting old rolling-portable artifact $artifact_id"
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              fi
            done
