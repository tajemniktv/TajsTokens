name: publish-smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TajsTokens.sln

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish src/TajsTokens.App/TajsTokens.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:WindowsAppSDKSelfContained=true `
            --no-restore `
            --output artifacts/TajsTokens-win-x64-portable

          if (-not (Test-Path artifacts/TajsTokens-win-x64-portable/TajsTokens.App.exe)) {
            throw "Published TajsTokens.App.exe was not produced."
          }

          Compress-Archive `
            -Path artifacts/TajsTokens-win-x64-portable/* `
            -DestinationPath artifacts/TajsTokens-win-x64-portable.zip

          $hash = (Get-FileHash artifacts/TajsTokens-win-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TajsTokens-win-x64-portable.zip" | Set-Content artifacts/TajsTokens-win-x64-portable.sha256

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TajsTokens-win-x64-portable
          path: |
            artifacts/TajsTokens-win-x64-portable.zip
            artifacts/TajsTokens-win-x64-portable.sha256
          if-no-files-found: error
